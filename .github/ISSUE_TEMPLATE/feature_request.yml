name: Feature request
description: 提出一个功能建议 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / The problem
      description: 现在哪里不顺手，为什么需要这个功能
      placeholder: 每次通话结束后没有摘要，记不住聊了什么
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      placeholder: 通话结束后自动生成一条记忆并写入记忆页
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Area
      options:
        - Dialogue / 对话
        - Emotion / 情感
        - Memory / 记忆
        - Voice call / 通话
        - Frontend UI / 前端界面
        - Android / 安卓
        - Deployment / 部署
        - Other
    validations:
      required: true
