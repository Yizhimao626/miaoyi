name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Byte-compile all backend modules
        run: python -m compileall -q server.py db_manager.py db_backend.py app_state.py memory_server.py config.py core services utils
      - name: Static check for runtime-breaking errors
        run: |
          pip install ruff
          ruff check --select F821,F811,F822,F823,E9,B023 .
      - name: Import smoke test (lightweight modules only)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part in {'.venv', 'venv', 'node_modules', 'frontend'} for part in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) if bad else 'AST OK')
          sys.exit(1 if bad else 0)
          PY

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run full unit test suite
        # 端到端 smoke 测试在无后端时自动跳过
        run: pytest tests -q --cov=core --cov=utils --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        # 直接用官方镜像，避免 GitHub Releases 下载偶发 504
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose --exit-code 1

  docker:
    name: Docker config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        # compose 引用 .env，CI 里用示例配置占位
        run: cp .env.example .env && docker compose config --quiet
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
