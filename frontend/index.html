<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>喵艺</title>
    <meta name="description" content="一款有灵魂的AI聊天伙伴，支持多维度情感系统、记忆功能、语音交互" />
    <meta name="theme-color" content="#7B54D9" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 【启动修复】Google Fonts 改非阻塞加载：原 render-blocking 样式在部分网络
         （如无法访问 Google 域名）会卡住首屏，表现为打开后一直停在加载页。
         media=print + onload 切回 all，字体照常生效但不再阻塞首帧渲染。 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="preloader">
      <img class="preloader-logo" src="/miaoyi/icons/icon_11.png" alt="" />
      <div class="preloader-text">喵艺</div>
      <div class="preloader-dots">
        <span class="preloader-dot"></span>
        <span class="preloader-dot"></span>
        <span class="preloader-dot"></span>
      </div>
      <div class="preloader-sub">正在连接喵艺…</div>
    </div>
    <script>
      // 【启动保护】React 挂载成功后 3 秒内会移除 preloader；若 6 秒后它还在，
      // 说明 JS bundle 加载/执行失败。把提示换成可操作的错误信息，而不是无限转圈。
      setTimeout(function () {
        var p = document.getElementById('preloader')
        if (p) {
          var t = p.querySelector('.preloader-text')
          if (t) t.textContent = '加载失败，请检查网络后重试'
          var d = p.querySelector('.preloader-dots')
          if (d) d.style.display = 'none'
        }
      }, 6000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 【历史教训】开发环境注册 Service Worker 会缓存 Vite 的 JS 模块，
      // 导致源代码修改后浏览器仍加载旧 bundle，所有热更新失效。
      // 修复：仅在非开发环境（生产/部署）注册 SW。
      if ('serviceWorker' in navigator) {
        var isDev = location.port === '5173' || location.port === '5174' || location.port === '5175' ||
                    location.hostname === 'localhost' || location.hostname === '127.0.0.1'
        if (!isDev) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/service-worker.js')
              .then(function (registration) {
                console.log('Service Worker registered:', registration.scope)
              })
              .catch(function (error) {
                console.log('Service Worker registration failed:', error)
              })
          })
        } else {
          // 开发环境：注销已有的 Service Worker + 清空所有缓存
          window.addEventListener('load', function () {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              registrations.forEach(function (reg) {
                console.log('[SW] 开发环境注销 Service Worker:', reg.scope)
                reg.unregister()
              })
            })
            if (window.caches) {
              caches.keys().then(function (names) {
                names.forEach(function (name) {
                  console.log('[SW] 清空缓存:', name)
                  caches.delete(name)
                })
              })
            }
          })
        }
      }
    </script>
  </body>
</html>
